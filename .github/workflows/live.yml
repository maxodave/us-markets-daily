name: Quotazioni LIVE

# Aggiorna live.json (livelli dei quattro indici + top 10 / worst 10 mover del
# momento) per la vista "LIVE" del sito. Il browser non puo' leggere Yahoo (CORS),
# quindi i dati li raccoglie qui un job e la pagina legge il file (stessa origine).
#
# ---------------------------------------------------------------------------
# TRE COSE CHE ROMPEVANO LA VISTA LIVE, E COME SONO RISOLTE (28 agosto 2026)
# ---------------------------------------------------------------------------
#
# 1) IL JOB ZOMBIE DELLA NOTTE. La fine della finestra era cablata alle 21:50 UTC
#    "di oggi", indipendentemente da QUANDO il job partiva. GitHub consegna gli
#    schedule anche con ore di ritardo: il 28/08/2026 uno slot della sera prima e'
#    arrivato alle 01:00 UTC, il job ha visto "fine alle 21:50 di oggi" e ha
#    ciclato tutta la notte a mercati chiusi — 24 fetch da 1.232 titoli, 24 commit
#    con gli stessi numeri, 24 build di Pages — finche' il timeout non l'ha ucciso
#    alle 06:55. E per tutte quelle ore ha tenuto occupato il gruppo "concurrency",
#    quindi quando la borsa ha aperto alle 13:30 non poteva partire nessuno: alle
#    15:25 UTC, a mercato aperto da due ore, il sito mostrava ancora i dati di
#    06:44. CURA: un CANCELLO IN INGRESSO. Il job calcola dove si trova nella
#    giornata di NEW YORK e, se e' fuori dalla finestra utile, esce in venti
#    secondi senza ciclare e senza occupare il gruppo.
#
# 2) LA FINESTRA CABLATA IN UTC SBAGLIA DI UN'ORA MEZZ'ANNO. 21:50 UTC sono le
#    17:50 di New York d'estate e le 16:50 d'inverno: due finestre diverse per lo
#    stesso numero. Ora inizio e fine si calcolano in ora di New York (09:00 ->
#    16:25 ET), che gestisce da se' il cambio dell'ora legale — come fa gia' il
#    browser nella pagina. Effetto collaterale utile: d'estate si risparmiano
#    quasi due ore di runner al giorno che prima giravano a borsa chiusa.
#
# 3) QUANDO PARTE IL PRIMO JOB DELLA GIORNATA — LA CAUSA VERA, TROVATA IL
#    04/09/2026. Per cinque volte si e' cercata la colpa nella forma del cron, e
#    per cinque volte non era li'. Il numero che conta non e' quanti slot si
#    scrivono, e' QUANTI SCHEDULE GITHUB CONSEGNA A QUESTO REPO IN UN GIORNO.
#    Contati con l'API, per giorno di borsa:
#
#      17 ago    9 consegne   prima alle 16:33 UTC
#      18 ago   19 consegne   prima alle 13:33      <- job brevi, nessun ciclo
#      -------- 19 agosto: entra il job che CICLA per ore --------
#      19 ago    5 consegne   prima alle 13:49
#      20 ago    4 consegne   prima alle 14:04
#      21 ago    4 consegne   prima alle 14:01
#      26 ago    3 consegne   prima alle 14:08
#      02 set    4 consegne   prima alle 16:30
#      03 set    4 consegne   prima alle 16:21
#      04 set    0 consegne   (alle 14:53, con la borsa aperta dalle 13:30)
#
#    Il giorno PRIMA che nascesse il job che cicla: DICIANNOVE consegne, la prima
#    tre minuti dopo l'apertura. Il giorno dopo: cinque. Da allora tre o quattro,
#    e sempre piu' tardi. E' una quota PER REPOSITORY, non per workflow: la prova
#    e' che il 04/09 sono stati scartati sia i tredici slot di live.yml sia i
#    quattro di live_open.yml, che aveva un file suo proprio per avere una coda
#    sua. (Quel file e' stato quindi rimosso: l'ipotesi su cui era nato e' falsa.)
#
#    LA SPIEGAZIONE, e purtroppo l'ironia. Il job che cicla e' nato il 19 agosto
#    per NON dipendere dallo scheduler di GitHub. Tiene occupato un runner per
#    quattro ore di fila, ogni giorno (misurato: 237 e 227 minuti il 2 e 3
#    settembre). Un sistema che deve distribuire runner gratuiti fra milioni di
#    repo pubblici mette in fondo alla coda chi ne occupa uno per mezza giornata.
#    Cioe': la cura ha creato la malattia, e ogni correzione successiva ha
#    raddoppiato la dose invece di toglierla.
#
# 4) LA CONSEGUENZA, E LA MODALITA' "once". Se il problema e' occupare i runner,
#    la strada non e' un cron piu' furbo: e' NON occuparli. Da qui l'input "mode":
#      - "loop"  (default, e cio' che usano gli schedule) — cicla fino a fine
#        seduta. Serve nei giorni in cui il Mac e' spento: una consegna sola
#        copre comunque delle ore, ed e' meglio di niente.
#      - "once" — un solo giro, ~40 secondi, e il runner e' libero. E' la
#        modalita' che usa il dispacciatore sul Mac (vedi il README, "L'accensione
#        dal Mac"): un timer locale controlla se la pagina e' ferma e, se lo e',
#        dispaccia un giro. Il Mac ha gia' un "gh" autenticato con lo scope
#        "workflow", quindi non serve creare nessun token.
#    Nei giorni con il Mac acceso si passa cosi' da ~4 ore di runner a ~30 minuti
#    in tutto: e' anche il modo di dare allo scheduler la possibilita' di
#    smettere di penalizzare il repo. Se fra una settimana le consegne tornano a
#    essere molte, allora si potra' tornare a job brevi anche per gli schedule.
#
# COME SI GARANTISCE IL PASSO. In "loop" lo garantisce il job stesso, che non
# dipende dallo scheduler dopo l'accensione. In "once" lo garantisce il timer sul
# Mac. Lo scheduler di GitHub serve solo come rete quando il Mac e' spento, e va
# considerato per quello che i dati dicono che e': tre o quattro consegne al
# giorno, la prima verso le 16:20 UTC.
#
# PERCHE' 10 MINUTI E NON 5. Il limite non e' Yahoo (nessuna chiave, nessuna
# quota: un giro dura ~40 secondi) e non sono i minuti Actions (repo pubblico,
# illimitati). Il limite vero e' GITHUB PAGES: ogni commit fa ripubblicare il
# sito, con un tetto indicativo di 10 build all'ora. A 10 minuti sono 6/ora e
# restano quattro slot per il job dell'edizione; a 5 minuti sarebbero 12 e Pages
# inizierebbe a rifiutare. La latenza percepita si taglia invece nella PAGINA,
# che chiede live.json con un parametro anti-cache (vedi templates/app.js): senza
# quello la CDN serviva per altri 10 minuti la copia vecchia.
#
# CATENA FACOLTATIVA (secret LIVE_CHAIN_TOKEN). Se esiste, alla fine di ogni
# segmento "loop" il job accende da se' il successivo via API. Utile, ma non
# risolve l'ACCENSIONE del mattino: tiene vivo un ciclo, non lo accende. Il
# GITHUB_TOKEN automatico non puo' servire a questo: GitHub gli vieta di far
# partire altri workflow, per evitare i loop.
#
# Nel weekend non gira: sab/dom non ci sono avvii (1-5 = lun-ven), e comunque il
# cancello in ingresso chiuderebbe. La striscia mostra "MARKETS CLOSED" perche'
# lo stato lo calcola il browser in ora di New York.
on:
  schedule:
    # LA FORMA CHE HA DATO I PRIMI AVVII PIU' PRECOCI (13:33 / 13:49 UTC): ogni
    # quarto d'ora dalle 13:00 alle 21:xx UTC, giorni feriali. Copre la seduta in
    # entrambi i regimi orari (09:00-16:25 di New York = 13:00-20:25 UTC d'estate,
    # 14:00-21:25 d'inverno). Non toccare senza misurare — vedi il punto 3 sopra.
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "loop = cicla fino a fine seduta (default, per gli schedule) · once = un solo giro e chiudi"
        required: false
        default: loop
        type: choice
        options: [loop, once]

permissions:
  contents: write

# Un solo job LIVE alla volta: gli avvii ridondanti si mettono in coda dietro a
# quello che sta gia' ciclando, non si accavallano (niente push in conflitto).
# Ora il gruppo si libera in fretta anche in caso di guaio, perche' un job che
# parte fuori orario non entra nel ciclo (vedi il cancello in ingresso).
concurrency:
  group: live-quotes
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    # Sotto il limite GitHub di 360'. Il job si ferma comunque da se' prima: la
    # durata vera la decide il segmento calcolato nello step, non questo tetto.
    timeout-minutes: 350
    env:
      TZ: Europe/Rome
      # Facoltativo (vedi testata). Se il secret non esiste arriva vuoto e la
      # catena resta spenta: il job fa un segmento lungo, come prima.
      LIVE_CHAIN_TOKEN: ${{ secrets.LIVE_CHAIN_TOKEN }}
    steps:
      # Il cancello in ingresso viene PRIMA di checkout e pip: un avvio fuori
      # orario deve costare secondi, non minuti di runner.
      - name: Cancello in ingresso (siamo dentro la seduta di New York?)
        id: gate
        run: |
          # Tutto in ora di NEW YORK: gestisce da se' il cambio dell'ora legale.
          DOW=$(TZ=America/New_York date +%u)             # 1=lun .. 7=dom
          NOW=$(( 10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M) ))
          # EARLY (08:00) e' la soglia di INGRESSO, OPEN (09:00) quella di lavoro:
          # un job consegnato fra le due non viene buttato, ASPETTA. Serve perche'
          # d'inverno gli slot delle 13:0x UTC cadono alle 08:0x di New York, e
          # prima venivano rifiutati: si sprecava proprio la consegna piu' vicina
          # all'apertura. Un'ora di attesa al massimo, su un repo pubblico e' gratis.
          EARLY=$((  8 * 60 ))       # 08:00 ET — si entra e si aspetta
          OPEN=$((   9 * 60 ))       # 09:00 ET — mezz'ora prima della campana
          CLOSE=$(( 16 * 60 + 25 ))  # 16:25 ET — dopo la campana, per i valori di chiusura
          echo "Ora di New York: $(TZ=America/New_York date '+%a %H:%M %Z')."

          if [ "$DOW" -gt 5 ]; then
            echo "Weekend a New York: niente seduta, esco."
            echo "run=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$NOW" -lt "$EARLY" ] || [ "$NOW" -ge "$CLOSE" ]; then
            echo "Fuori dalla finestra 08:00-16:25 ET: esco senza ciclare."
            echo "(E' il caso che il 28/08/2026 aveva fatto ciclare un job tutta la notte.)"
            echo "run=no" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Inizio e fine finestra in epoch, ricalcolati dall'ora di New York di OGGI.
          START=$(TZ=America/New_York date -d 'today 09:00' +%s)
          END=$(TZ=America/New_York date -d 'today 16:25' +%s)
          echo "run=yes" >> "$GITHUB_OUTPUT"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          if [ "$NOW" -lt "$OPEN" ]; then
            echo "Consegnato in anticipo: aspetto le $(TZ=America/New_York date -d "@$START" '+%H:%M %Z') e poi ciclo."
          fi
          echo "Ciclo fino alle $(TZ=America/New_York date -d "@$END" '+%H:%M %Z')."

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'yes'

      - name: Quotazioni — un giro solo, oppure il ciclo fino a fine finestra
        if: steps.gate.outputs.run == 'yes'
        env:
          START: ${{ steps.gate.outputs.start }}
          END: ${{ steps.gate.outputs.end }}
          # "once" = un solo giro e chiudi (lo usa il dispacciatore sul Mac, che sa
          # gia' che la pagina e' ferma adesso). "loop" = cicla fino a fine seduta,
          # ed e' il default: e' cio' che serve agli schedule, che arrivano rari.
          MODE: ${{ inputs.mode || 'loop' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Un giro: quota, e committa SOLO se i numeri sono cambiati davvero
          # (fetch_live_quotes.py non riscrive il file a borsa chiusa con dati
          # identici, quindi qui non si generano commit e build di Pages a vuoto).
          giro() {
            python pipeline/fetch_live_quotes.py . || { echo "fetch fallito"; return 0; }
            git add live.json
            if git diff --cached --quiet; then
              echo "Quotazioni invariate: nessun commit."
              return 0
            fi
            git commit -q -m "Live quotes $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Un altro job puo' aver spinto nel frattempo: riallinea prima di push,
            # e se il push fallisce non fermare niente — il giro dopo recupera.
            git pull -q --rebase --autostash || true
            git push -q || echo "push fallito, riprovo al giro dopo"
          }

          if [ "$MODE" = "once" ]; then
            # Nessuna attesa dell'apertura: chi dispaccia in questa modalita' ha
            # gia' verificato che serve ORA. Un giro dura ~40 secondi, e questa e'
            # la modalita' che NON tiene occupato un runner per ore — il motivo per
            # cui esiste sta in testa al file, punto 5.
            echo "Modalita' once: un solo giro."
            giro
            echo "Fatto."
            exit 0
          fi

          # --- da qui in giu' solo la modalita' loop ---------------------------
          # Attesa dell'apertura, se la consegna e' arrivata in anticipo (vedi
          # EARLY nel cancello). Al massimo un'ora.
          WAIT=$(( ${START:-0} - $(date -u +%s) ))
          [ "$WAIT" -gt 3600 ] && WAIT=3600
          if [ "$WAIT" -gt 0 ]; then
            echo "Aspetto ${WAIT}s l'apertura della finestra."
            sleep "$WAIT"
          fi

          # Lunghezza del segmento. Con la catena accesa segmenti brevi: se un job
          # muore, il successivo riprende in pochi minuti invece che in ore. Senza
          # catena un segmento lungo, perche' li' l'unica rete sono gli schedule,
          # che questo repo riceve tre o quattro volte al giorno (vedi punto 5).
          # SEGMENTO PIU' CORTO (150', era 330'). E' il compromesso fra le due cose
          # che si contendono: una consegna sola deve coprire piu' ore possibile
          # (giorni a Mac spento), ma occupare un runner mezza giornata e' cio' che
          # ha fatto crollare le consegne da 19 a 3 al giorno (vedi punto 3). Con
          # 150' una consegna copre due ore e mezza e il runner si libera. Se fra
          # una settimana le consegne risalgono, si scende ancora.
          if [ -n "${LIVE_CHAIN_TOKEN:-}" ]; then SEG=$(( 75 * 60 )); else SEG=$(( 150 * 60 )); fi
          STOP=$(( $(date -u +%s) + SEG ))
          [ "$STOP" -gt "$END" ] && STOP="$END"
          echo "Segmento fino alle $(date -u -d "@$STOP" '+%H:%M UTC') (finestra fino alle $(date -u -d "@$END" '+%H:%M UTC'))."

          # PASSO DI 10 MINUTI (era 15). Il tetto non e' Yahoo (un giro dura ~40
          # secondi, senza chiavi ne' quote) ma GitHub Pages, che ripubblica il
          # sito a ogni commit con un limite indicativo di 10 build all'ora: a 10
          # minuti sono 6 build/ora e restano quattro slot per il job
          # dell'edizione. Se Pages iniziasse a rifiutare, si torna a 12 o 15.
          PASSO=600
          while [ "$(date -u +%s)" -lt "$STOP" ]; do
            giro
            [ "$(( $(date -u +%s) + PASSO ))" -ge "$STOP" ] && break
            sleep "$PASSO"
          done

          # Passaggio del testimone, se il segreto c'e' e la seduta non e' finita.
          if [ -n "${LIVE_CHAIN_TOKEN:-}" ] && [ "$(( $(date -u +%s) + 600 ))" -lt "$END" ]; then
            echo "Accendo il segmento successivo (catena)."
            curl -sS -o /dev/null -w 'HTTP %{http_code}\n' -X POST \
              -H "Authorization: Bearer ${LIVE_CHAIN_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/live.yml/dispatches" \
              -d '{"ref":"main"}' || echo "dispatch fallito: restano gli schedule come rete."
          fi
          echo "Segmento concluso."
