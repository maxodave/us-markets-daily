name: Quotazioni LIVE

# Aggiorna live.json (livello e variazione % dei quattro indici) per la striscia
# "LIVE" del sito. Leggero: quattro simboli, nessuna notizia.
#
# Gira SOLO quando Wall Street e' aperta: giorni feriali, ogni 15 minuti dalle
# 13:00 alle 20:45 UTC. A mercati chiusi le quotazioni non cambiano — rigenerare
# di notte o nel weekend produce solo run inutili (e ogni tanto un pages-build a
# vuoto). La finestra 13-20 UTC copre la seduta USA in entrambi i regimi orari:
# d'estate 13:30-20:00 UTC (piena), d'inverno 14:30-21:00 UTC (fino a 20:45, poi
# la chiusura ufficiale la fissa comunque l'edizione serale delle 21:30 UTC).
# Ogni 15 minuti (non 30) perche' GitHub puo' ritardare o SALTARE del tutto uno
# slot schedulato nei momenti di carico: col passo a 15' un salto lascia uno
# scarto di ~15-20 min invece di 60+. (Verificato il 17/08/2026: col passo a 30'
# gli slot delle 16:00 e 17:00 UTC non erano mai partiti.)
#
# La striscia mostra "MARKETS CLOSED" comunque, anche fuori da questa finestra:
# lo stato aperto/chiuso lo calcola il browser in ora di New York, non serve un
# run per dirlo.
on:
  schedule:
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-quotes
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Quotazioni dei quattro indici
        run: python pipeline/fetch_live_quotes.py .

      - name: Pubblica se qualcosa e' cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          if git diff --cached --quiet; then
            echo "Quotazioni invariate."
          else
            git commit -m "Live quotes $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
