name: Edizione giornaliera

# Aggiorna il sito da solo, senza dipendere dal Mac dell'autore.
#
# 21:30 UTC = SUBITO DOPO la chiusura di Wall Street (20:00 UTC d'estate, 21:00
# d'inverno), e ancora SERA in Italia (23:30 d'estate, 22:30 d'inverno). Due cose
# in una: il riepilogo e' pronto gia' la sera con i dati di CHIUSURA (non un
# intraday di meta' giornata), e — poiche' build_edition.py data l'edizione con
# datetime.now() in ora italiana, cioe' ancora lo stesso giorno della seduta —
# esce come "Edition of <oggi> · session of <oggi>", una sola edizione per seduta.
# (Prima girava alle 22:00 UTC = mezzanotte italiana d'estate: aggiornava tardi e
# datava l'edizione al giorno DOPO solo d'estate — un'incoerenza stagionale.)
#
# Nel FINE SETTIMANA (sabato e domenica) non c'e' una seduta nuova, ma le notizie
# continuano ad arrivare: si rigenera ogni 6 ore (00/06/12/18 UTC) cosi' il digest
# "Mercati" e la riga laterale "Top Mercati" restano freschi — sabato con le
# notizie del sabato, domenica con le ultime della domenica. Questi run saltano il
# fetch pesante delle notizie per singolo titolo (vedi lo step gated sotto): a
# Wall Street chiusa non c'e' nulla di nuovo da spiegare per i mover.
on:
  schedule:
    - cron: "30 21 * * *"
    - cron: "0 */6 * * 6,0"
  workflow_dispatch:

# Il workflow scrive nel repo in cui vive, quindi basta il GITHUB_TOKEN
# automatico: nessun token personale da creare o da rinnovare.
permissions:
  contents: write

# Un solo run per volta: due job che riscrivono index.html si sovrapporrebbero.
concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # I runner girano in UTC: senza questo, alle 22:00 datetime.now() darebbe
      # ancora il giorno precedente e l'edizione uscirebbe datata a ieri.
      TZ: Europe/Rome
      # Usata solo da generate_commentary.py. Se il secret non e' impostato la
      # variabile arriva vuota e quello script salta il commento senza errori
      # (vedi il file): il resto della pipeline non dipende da questa chiave.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Giorno della settimana in UTC (1=lun .. 7=dom): decide se questo e' un run
      # feriale (seduta nuova) o del fine settimana (solo notizie). Il run delle
      # 22:00 UTC di venerdi' e' un run FERIALE (weekday=5) e raccoglie la seduta di
      # venerdi'; sabato e domenica (6,7) saltano il fetch pesante.
      - name: Giorno della settimana (UTC)
        id: cal
        run: echo "weekday=$(date -u +%u)" >> "$GITHUB_OUTPUT"

      - name: Dati di mercato S&P 500
        run: python pipeline/fetch_data.py

      # Universo dei mover LIVE: tutto il mercato USA (NYSE + Nasdaq + NYSE
      # American) filtrato per liquidita'. Serve al job live.yml, che ogni 15 min
      # quota SOLO queste ~850 societa' (un minuto) invece delle 5.500 del listino
      # (cinque minuti, insostenibile a quella frequenza). Si rifa' una volta al
      # giorno perche' la liquidita' cambia lentamente. Nel fine settimana si
      # salta: i volumi sarebbero ancora quelli di venerdi'. Non fatale — se
      # fallisce, live.yml continua con l'universo del giorno prima.
      - name: Universo LIVE (mercato USA liquido)
        if: steps.cal.outputs.weekday != '6' && steps.cal.outputs.weekday != '7'
        run: python pipeline/build_live_universe.py .
        continue-on-error: true

      # Solo i titoli agli estremi della seduta: sono i soli che finiscono
      # nell'edizione, e ~1000 richieste a Google News da un IP di datacenter
      # verrebbero probabilmente limitate. Nel fine settimana (weekday 6/7) si
      # salta: Wall Street e' chiusa, non ci sono nuovi mover da spiegare e
      # l'edizione diventa un riassunto di notizie (vedi weekend_edition.py).
      - name: Notizie dei mover
        if: steps.cal.outputs.weekday != '6' && steps.cal.outputs.weekday != '7'
        run: python pipeline/fetch_news.py --movers-only

      - name: Feed notizie con immagini
        run: python pipeline/fetch_feed_news.py

      # Contesto macro per il commento discorsivo del passo successivo. Se
      # fallisce non e' fatale: generate_commentary.py scrive senza contesto
      # macro (o salta il commento) se general_news_pool.json non c'e'.
      - name: Notizie macro del giorno
        run: python pipeline/fetch_general_news.py
        continue-on-error: true

      # Prima passata: crea l'edizione con i mover e le loro motivazioni
      # (mover_reason.py), che il passo successivo legge per scrivere il
      # commento. Senza ANTHROPIC_API_KEY questa e' anche l'edizione finale.
      - name: Edizione del giorno (resoconto automatico)
        run: python pipeline/build_edition.py --force

      # Scrive il commento discorsivo chiamando l'API Claude. Il modello scrive
      # SOLO la prosa: non riceve mai e non puo' mai restituire un link o una
      # testata ‚Äî quelli restano sempre quelli gia' verificati da
      # mover_reason.py. Se manca la chiave, se la chiamata fallisce o se la
      # risposta non ha la forma attesa, lo script non scrive nulla ed esce
      # con codice 0: il passo successivo semplicemente non trova un commento
      # da aggiungere, e il sito esce comunque con il resoconto automatico.
      - name: Commento discorsivo (facoltativo)
        run: python pipeline/generate_commentary.py

      # Seconda passata: se il passo sopra ha scritto market_summary_it.json,
      # questa rigenera l'edizione includendo il commento. Se non l'ha
      # scritto, produce lo stesso identico file di prima: rilanciare
      # build_edition.py e' innocuo, non e' un doppio conteggio.
      - name: Edizione del giorno (con commento, se presente)
        run: python pipeline/build_edition.py --force

      # Serie in corso per societa' (da quanti giorni di fila ogni titolo sale o
      # scende), per la vista "Day by day". Deve girare PRIMA della pagina, che
      # inserisce streaks.json al momento della build. Non fatale: se salta, la
      # vista dice che le serie non ci sono ancora e il resto esce comunque.
      - name: Serie in corso (Day by day)
        run: python pipeline/fetch_streaks.py .
        continue-on-error: true

      - name: Pagina pubblica
        run: python pipeline/build_public_page.py .

      # Se un passo qui sopra fallisce il job si ferma e non committa: il sito
      # resta all'edizione precedente invece di pubblicarne una incompleta.
      - name: Pubblica se qualcosa e' cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html editions universe.json universe_live.json streaks.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica rispetto all'ultima pubblicazione."
          else
            git commit -m "Edizione del $(date '+%Y-%m-%d %H:%M %Z')"
            git push
          fi

      # ---------------------------------------------------------------------
      # LO SCATTO DELLA GIORNATA, per il diario della vista "Day by day".
      #
      # Va DOPO la pubblicazione, e sul sito ONLINE: fotografare index.html dal
      # disco non funzionerebbe, perche' da "file://" il browser non puo' leggere
      # live.json (stessa origine negata) e la pagina uscirebbe incompleta.
      # Da qui l'attesa: GitHub Pages ci mette un minuto a ripubblicare, e senza
      # quella pausa si fotograferebbe l'edizione di IERI.
      #
      # "?shot" toglie l'eroe a tutta altezza e forza la vista edizione (vedi
      # templates/app.js): senza, ogni scheda del diario mostrerebbe la stessa
      # immagine, perche' l'eroe non cambia mai.
      #
      # Si ridimensiona a 640px di larghezza: le schede del diario sono
      # miniature, e un PNG da 1280 al giorno vorrebbe dire ~150 MB di repo
      # all'anno per pixel che nessuno guarda. A 640 sono ~30 MB.
      #
      # Tutto lo step e' "continue-on-error": un diario senza lo scatto di un
      # giorno e' un difetto piccolo, un'edizione non pubblicata no.
      # ---------------------------------------------------------------------
      - name: Scatto della giornata (diario)
        continue-on-error: true
        run: |
          set -x
          GIORNO=$(date '+%Y-%m-%d')
          mkdir -p shots
          echo "Aspetto che GitHub Pages ripubblichi..."
          sleep 150

          CHROME=""
          for c in google-chrome google-chrome-stable chromium-browser chromium; do
            command -v "$c" >/dev/null 2>&1 && { CHROME="$c"; break; }
          done
          if [ -z "$CHROME" ]; then
            echo "Nessun browser sul runner: niente scatto per oggi."
            exit 0
          fi

          "$CHROME" --headless=new --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=1280,1500 --virtual-time-budget=20000 \
            --screenshot="shots/$GIORNO.raw.png" \
            "https://maxodave.github.io/us-markets-daily/?shot=1" || true

          if [ ! -s "shots/$GIORNO.raw.png" ]; then
            echo "Scatto non prodotto: niente da committare."
            rm -f "shots/$GIORNO.raw.png"
            exit 0
          fi

          # DUE VERSIONI, e le misure che le hanno decise (stesso scatto):
          #   miniatura  PNG  480px/128 colori  ->  134 KB   (scheda del diario)
          #   grande     JPEG 1280px q82        ->  302 KB   (visore a schermo
          #                                                   intero, al clic)
          # Per la grande il JPEG non e' una scorciatoia: lo STESSO scatto a
          # 1280px in PNG a 128 colori pesa 870 KB, quasi il triplo, per un
          # risultato che a occhio non si distingue — verificato leggendo i
          # numeri dell'edizione nell'immagine. La miniatura resta PNG perche' a
          # 480px la palette vince.
          # In tutto ~436 KB al giorno, cioe' ~110 MB di repo all'anno. Se un
          # giorno pesasse troppo, la manopola e' la grande: 1100px q74 fa
          # 208 KB (~75 MB/anno) e resta leggibile.
          mkdir -p shots/full
          if command -v convert >/dev/null 2>&1; then
            convert "shots/$GIORNO.raw.png" -resize 480x -colors 128 -strip \
              -define png:compression-level=9 "shots/$GIORNO.png"
            convert "shots/$GIORNO.raw.png" -resize 1280x -strip \
              -interlace Plane -quality 82 "shots/full/$GIORNO.jpg"
            rm -f "shots/$GIORNO.raw.png"
          else
            # Senza ImageMagick si salva almeno la miniatura (che qui e' lo
            # scatto a grandezza naturale): meglio una scheda con un'immagine
            # pesante che una scheda vuota.
            mv "shots/$GIORNO.raw.png" "shots/$GIORNO.png"
          fi
          ls -la "shots/$GIORNO.png"

          # La pagina legge l'elenco degli scatti al momento della build (vedi
          # list_shots in build_public_page.py), quindi va rigenerata: altrimenti
          # lo scatto di oggi esiste sul disco ma la scheda continua a dire che
          # non c'e'.
          python pipeline/build_public_page.py .

          git add "shots/$GIORNO.png" index.html
          [ -f "shots/full/$GIORNO.jpg" ] && git add "shots/full/$GIORNO.jpg"
          if git diff --cached --quiet; then
            echo "Nessuna modifica."
          else
            git commit -m "Scatto del $GIORNO"
            git pull -q --rebase --autostash || true
            git push
          fi
