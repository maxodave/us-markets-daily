name: Edizione giornaliera

# Aggiorna il sito da solo, senza dipendere dal Mac dell'autore.
# 22:00 UTC = mezzanotte in Italia con l'ora estiva (23:00 con l'ora solare):
# in entrambi i casi Wall Street ha chiuso da diverse ore.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

# Il workflow scrive nel repo in cui vive, quindi basta il GITHUB_TOKEN
# automatico: nessun token personale da creare o da rinnovare.
permissions:
  contents: write

# Un solo run per volta: due job che riscrivono index.html si sovrapporrebbero.
concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # I runner girano in UTC: senza questo, alle 22:00 datetime.now() darebbe
      # ancora il giorno precedente e l'edizione uscirebbe datata a ieri.
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Dati di mercato S&P 500
        run: python pipeline/fetch_data.py

      # Solo i titoli agli estremi della seduta: sono i soli che finiscono
      # nell'edizione, e ~1000 richieste a Google News da un IP di datacenter
      # verrebbero probabilmente limitate.
      - name: Notizie dei mover
        run: python pipeline/fetch_news.py --movers-only

      - name: Feed notizie con immagini
        run: python pipeline/fetch_feed_news.py

      - name: Edizione del giorno
        run: python pipeline/build_edition.py --force

      - name: Pagina pubblica
        run: python pipeline/build_public_page.py .

      # Se un passo qui sopra fallisce il job si ferma e non committa: il sito
      # resta all'edizione precedente invece di pubblicarne una incompleta.
      - name: Pubblica se qualcosa e' cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html editions
          if git diff --cached --quiet; then
            echo "Nessuna modifica rispetto all'ultima pubblicazione."
          else
            git commit -m "Edizione del $(date '+%Y-%m-%d %H:%M %Z')"
            git push
          fi
